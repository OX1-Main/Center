<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://*.supabase.co; img-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" />
  <meta name="referrer" content="no-referrer" />
  <title>My Services — Admin Panel</title>
  <link rel="stylesheet" href="styles.css?v=11" />
</head>
<body>
  <div class="login-wrap" id="loginView" hidden>
    <div class="login-card">
      <div class="login-logo">
        <div class="login-mark">M</div>
        <h1>My Services</h1>
        <p>Admin panel</p>
      </div>
      <div class="login-tabs" id="loginTabs">
        <button class="login-tab active" id="tabSignin" type="button">Sign in</button>
        <button class="login-tab" id="tabSignup" type="button">Create account</button>
      </div>
      <form id="loginForm" novalidate>
        <label class="field" id="fieldFullName" hidden><span>Full name</span><input id="signupName" type="text" autocomplete="name" placeholder="Jane Doe" /></label>
        <label class="field"><span>Email</span><input id="loginEmail" type="email" autocomplete="email" placeholder="you@company.com" required /></label>
        <label class="field"><span>Password</span><input id="loginPassword" type="password" autocomplete="current-password" placeholder="••••••••" required /></label>
        <label class="field" id="fieldConfirm" hidden><span>Confirm password</span><input id="signupConfirm" type="password" autocomplete="new-password" placeholder="••••••••" /></label>
        <div class="pw-meter" id="pwMeter" hidden><div class="pw-bar" id="pwBar"></div><span class="pw-label" id="pwLabel"></span></div>
        <div class="login-error" id="loginError" role="alert" hidden></div>
        <button class="btn btn-primary btn-block" id="loginSubmit" type="submit">
          <span class="btn-label">Sign in</span>
        </button>
      </form>
      <div class="login-mfa" id="mfaStep" hidden>
        <label class="field"><span id="mfaLabel">Enter the 6-digit code from your authenticator app</span><input id="mfaCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" /></label>
        <div class="login-error" id="mfaError" role="alert" hidden></div>
        <button class="btn btn-primary btn-block" id="mfaSubmit" type="button">Verify</button>
        <button class="login-link" id="mfaBack" type="button">Back</button>
      </div>
      <p class="login-foot">
        <button class="login-link" id="recoveryLink" type="button">Recover access with recovery key</button>
      </p>
      <p class="login-foot">Secured with Supabase Auth</p>
    </div>
  </div>

  <div class="preview" style="display:none">
    <div class="app" id="app">
      <aside class="sidebar" id="sidebar">
        <div class="ws-switcher" id="wsSwitcher">
          <button class="ws-btn" id="wsBtn" type="button" aria-haspopup="listbox" aria-label="Switch panel">
            <div class="ws-left">
              <div class="ws-avatar" id="wsAvatar">M</div>
              <div class="ws-meta">
                <span class="ws-name" id="wsName">My Services</span>
                <span class="ws-plan" id="wsRole">Admin Panel</span>
              </div>
            </div>
            <svg class="icon ws-chevron" id="wsChevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"></svg>
          </button>
          <div class="ws-backdrop" id="wsBackdrop"></div>
          <div class="ws-dropdown" id="wsDropdown" role="listbox"></div>
        </div>
        <nav class="nav" id="nav" aria-label="Main navigation"></nav>
        <div class="nav-bottom" id="navBottom"></div>
      </aside>
      <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

      <main class="main">
        <header class="topbar">
          <div class="breadcrumb">
            <button class="collapse-btn" id="collapseBtn" type="button" aria-label="Toggle sidebar">
              <span id="collapseIcon"></span>
            </button>
            <span class="bc-part" id="bcWorkspace">My Services</span>
            <span class="bc-part">/</span>
            <span class="bc-part current" id="bcTitle">Dashboard</span>
          </div>
          <div class="topbar-right">
            <button class="lang-btn" id="langBtn" type="button" title="Language / Idioma">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"></svg>
              <span class="lang-label">EN</span>
            </button>
            <button class="search-pill" id="searchPill" type="button">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"></svg>
              <span>Search clients, apps, projects...</span>
              <kbd>&#8984;K</kbd>
            </button>
            <div class="topbar-user" id="topbarUser">
              <div class="avatar-circle" id="topAvatar"></div>
              <div class="topbar-user-meta">
                <span id="topUserEmail">—</span>
                <span id="topUserRole" class="sale-sub">—</span>
              </div>
            </div>
          </div>
        </header>

        <div class="view" id="view"></div>
      </main>

      <div class="search-overlay" id="searchOverlay">
        <div class="overlay-backdrop" id="overlayBackdrop"></div>
        <div class="search-modal">
          <div class="search-header">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"></svg>
            <input class="search-input" id="searchInput" type="text" placeholder="Search clients, apps, projects..." autocomplete="off" />
            <span class="search-esc" id="searchEsc">ESC</span>
            <button class="search-close" id="searchClose" type="button" aria-label="Close search"></button>
          </div>
          <div class="search-results" id="searchResults"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="boot-overlay" id="bootOverlay" hidden>
    <div class="boot-card"><div class="boot-spinner"></div><p id="bootMsg">Connecting…</p></div>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot"></div>
  <div class="form-backdrop" id="formBackdrop" hidden></div>
  <div class="form-root" id="formRoot" role="dialog" aria-modal="true" hidden></div>

  <script src="boottrace.js?v=9"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js?v=8"></script>
  <script src="diag.js?v=8"></script>
  <script src="db.js?v=9"></script>
  <script src="i18n.js?v=9"></script>
  <script src="script.js?v=11"></script>
  <!-- OX1 Segurity - módulo de licencias -->
  <script src="db-licenses.js"></script>
  <script src="view-licenses.js"></script>
</body>
</html>
